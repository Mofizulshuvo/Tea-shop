<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Store</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="ml-[13.75rem] mt-[4.375rem] mr-[13.75rem] sm:ml-[2rem] sm:mt-[2rem] sm:mr-[2rem] md:ml-[6rem] md:mt-[6rem] md:mr-[6rem] bg-[rgba(255,255,255,1)] ">
    <div class="section1 border border-solid border-black   flex justify-center justify-items-center-safe w-[100%]  sm:flex-row sm:justify-center sm:justify-items-center-safe sm:w-[100%] ">
        <div class="left-section1 border border-solid border-black h-[34.375rem] w-1/2">
            <h2 class="manrope_font font-bold text-[80px] leading-tight">It's good <br /> tea time at The<br /> Tea
                House</h2>
            <p class="manrope_font text-[18px] text-[18px] text-[rgba(119,119,119,1)]">Tea and Botanical Solutions Supplier Give
                Optimum <br />Satisfaction To Your Taste Buds.</p>
            <button
                class="bg-gradient-to-r from-[rgba(255,0,0,1)] to-[rgba(255,137,56,1)] text-white flex w-[200px] h-[64px] items-center justify-center gap-[15px] rounded-[10px]">Explore
                More <img src="tea-house-resources\images\arrow.png" class="w-[15px] h-[15px] " alt="">
            </button>
        </div>

        <div class="right-section1    border border-solid border-black   w-1/2 h-[550px]  text-center transform translate-y-[150px]">  
           
            <img src="tea-house-resources\images\banner.png" class=" inline-block  w-[450px] h-[450px] " alt="">
           
            <div
                class="rating flex items-center justify-center ml-[150px] w-[220px] h-[70px]     bg-red-100 gap-[20px]  rounded-[10px] transform translate-x-[-80px] translate-y-[-90px]">
                
                <div> <i class="fa-solid fa-star text-yellow-400 text-[28px]"></i></div>
               
                <div class="text-left ">
                    <h2 class=" font-bold">5.00</h2>
                    <p class="text-[rgba(119,119,119,1)]"> Trust Pilot Rating </p>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
